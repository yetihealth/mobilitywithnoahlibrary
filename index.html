<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小纖女體態檢索庫</title>
  <style>
    :root {
      --bg: #F1ECE3;
      --panel: #F7F3EA;
      --panel2: #EDE9DF;
      --text: #1E1E1C;
      --muted: #8E887E;
      --line: #D8D1C5;
      --accent: #3F5A32;
      --accent2: #5F7A4E;
      --danger: #B42318;
      --ok: #5F7A4E;
      --shadow: 0 18px 45px rgba(30,30,28,.08);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(63,90,50,.12), transparent 34%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.55;
    }
    .app { max-width: 1180px; margin: 0 auto; padding: 28px 18px 48px; }
    .hero {
      display: grid; grid-template-columns: 1fr; gap: 20px; align-items: end;
      padding: 26px; border: 1px solid var(--line); border-radius: 28px;
      background: linear-gradient(135deg, #F7F3EA, #F1ECE3);
      box-shadow: var(--shadow);
    }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
    h1 { margin: 8px 0 8px; color: var(--accent); font-size: clamp(30px, 4.6vw, 54px); line-height: 1.05; letter-spacing: -0.04em; }
    .lead { margin: 0; color: var(--muted); max-width: 720px; font-size: 16px; }
    .countBox { color: var(--muted); text-align: right; font-size: 14px; white-space: nowrap; }
    .countBox b { color: var(--text); font-size: 28px; display:block; }
    .librarySwitch { margin-top: 16px; display:flex; gap: 10px; flex-wrap: wrap; }
    .libraryTab {
      border: 1px solid var(--line); background: #FFFFFF; color: var(--text);
      border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: .15s; font-size: 14px; font-weight: 700;
    }
    .libraryTab:hover { border-color: #5F7A4E; background: #E7E6D9; }
    .libraryTab.active { background: var(--accent); color: #F7F3EA; border-color: var(--accent); }

    .layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; margin-top: 18px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .panel h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: var(--muted); font-size: 13px; margin: -6px 0 14px; }
    .humanWrap { position: relative; display: grid; place-items: center; padding: 10px 0 0; min-height: 350px; overflow: visible; }
    .human { width: 190px; height: 320px; z-index: 1; }
    .human .stroke { fill: none; stroke: rgba(63,90,50,.42); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .hotspot { cursor: pointer; fill: rgba(63,90,50,.08); stroke: rgba(95,122,78,.28); transition: .18s; }
    .hotspot:hover, .hotspot.active { fill: rgba(63,90,50,.16); stroke: rgba(63,90,50,.72); }
    .bodyBtns { position:absolute; inset: 0; z-index: 2; pointer-events:none; }
    .bodyBtn, .chip, .smallBtn {
      border: 1px solid var(--line); background: #FFFFFF; color: var(--text);
      border-radius: 999px; padding: 10px 13px; cursor: pointer; transition: .15s; font-size: 14px;
    }
    .bodyBtn {
      position: absolute; display:flex; justify-content:space-between; align-items:center; gap: 8px;
      width: auto; min-width: 82px; padding: 8px 11px; border-radius: 999px; pointer-events:auto;
      background: rgba(247,243,234,.92); backdrop-filter: blur(6px); box-shadow: 0 10px 24px rgba(30,30,28,.06);
    }
    .bodyBtn[data-body="肩頸"] { top: 22px; left: 50%; transform: translateX(-50%); }
    .bodyBtn[data-body="腰背"] { top: 124px; left: 6px; }
    .bodyBtn[data-body="骨盆臀型"] { top: 150px; right: 2px; }
    .bodyBtn[data-body="腿型"] { top: 238px; right: 18px; }
    .bodyBtn[data-body="足底"] { bottom: 0; left: 50%; transform: translateX(-50%); }
    .bodyBtn span:last-child { color: var(--muted); font-size: 12px; }
    .bodyBtn:hover, .chip:hover, .smallBtn:hover { border-color: #5F7A4E; background: #E7E6D9; }
    .bodyBtn.active, .chip.active, .smallBtn.active { background: var(--accent); color: #F7F3EA; border-color: var(--accent); font-weight: 800; }
    .bodyBtn.active span:last-child { color: rgba(247,243,234,.72); }
    .chip.disabled { opacity: .45; }
    #resetBtn { padding: 0 15px; font-size: 13px; min-width: 56px; height: 42px; border-radius: 999px; white-space: nowrap; }
    .filters { display: grid; gap: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .searchRow { display:grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items:center; margin-top: 14px; }
    input[type="search"] {
      width: 100%; height: 42px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line);
      background: #FFFFFF; color: var(--text); outline: none;
    }
    input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,90,50,.10); }
    .toolbar { display:flex; justify-content:space-between; gap: 12px; align-items:center; margin-bottom: 14px; }
    .resultCount { color: var(--muted); font-size: 14px; }
    .cards { display: grid; gap: 12px; }
    .card {
      position: relative; background: linear-gradient(180deg, #FFFFFF, #F7F3EA);
      border: 1px solid var(--line); border-radius: 20px; padding: 16px; cursor: pointer; transition: .16s; overflow:hidden;
    }
    .card:hover { transform: translateY(-2px); border-color: #5F7A4E; box-shadow: 0 16px 30px rgba(30,30,28,.10); }
    .cardTop { display:flex; justify-content:space-between; gap: 12px; align-items:flex-start; }
    .cardTitle { display:flex; gap: 10px; align-items:flex-start; font-weight: 850; font-size: 18px; line-height: 1.35; }
    .num { color: var(--accent); min-width: 28px; }
    .tag { background: #E7E6D9; border: 1px solid #D8D1C5; color: var(--accent2); padding: 5px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .reason { margin: 10px 0 0 38px; color: var(--muted); }
    .meta { margin: 11px 0 0 38px; display:flex; gap: 8px; flex-wrap:wrap; color: var(--muted); font-size: 12px; }
    .pill { border:1px solid var(--line); border-radius:999px; padding:4px 8px; background:#F1ECE3; }
    .hasUrl { color: var(--ok); border-color: rgba(131,227,181,.35); }

    .cardAction {
      margin: 13px 0 0 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 999px;
      background: var(--accent);
      color: #F7F3EA;
      font-size: 13px;
      font-weight: 850;
      border: 1px solid var(--accent);
    }
    .cardAction:hover { background: var(--accent2); border-color: var(--accent2); }
    .cardAction.disabled { background: #E7E6D9; color: var(--muted); border-color: var(--line); pointer-events: none; }
    .empty { color: var(--muted); text-align:center; padding: 40px 20px; border: 1px dashed var(--line); border-radius: 20px; }
    .modalBackdrop { position: fixed; inset: 0; background: rgba(30,30,28,.42); display:none; z-index: 50; padding: 18px; overflow: hidden; }
    .modalBackdrop.show { display: flex; align-items: center; justify-content: center; }
    .modal { width: min(760px, 100%); max-height: calc(100dvh - 36px); background: #FFFFFF; border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); overflow:hidden; display: flex; flex-direction: column; }
    .modalHead { padding: 18px 18px 12px; display:flex; justify-content:space-between; gap: 14px; align-items:flex-start; border-bottom: 1px solid var(--line); }
    .modalTitle { margin:0; font-size: 22px; line-height:1.3; }
    .close { border:0; background:#E7E6D9; color:var(--text); width:36px; height:36px; border-radius:999px; cursor:pointer; font-size:22px; }
    .modalBody { padding: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modalGrid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .infoBox { border:1px solid var(--line); border-radius:16px; padding:10px; background:#F1ECE3; }
    .infoBox small { display:block; color:var(--muted); margin-bottom:3px; }
    .sectionTitle { color: var(--accent); font-weight: 800; margin: 14px 0 6px; }
    .modalText { color: var(--text); margin:0; white-space: pre-wrap; }
    .movements { color: var(--muted); margin-top: 6px; font-size: 14px; white-space: pre-wrap; }
    .modalActions { display:flex; gap: 10px; margin-top: 18px; flex-wrap:wrap; }
    .primaryLink { display:inline-flex; text-decoration:none; align-items:center; justify-content:center; padding: 12px 16px; border-radius: 999px; background: var(--accent); color:#F7F3EA; font-weight:850; }
    .disabledLink { display:inline-flex; padding: 12px 16px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }

    .trialNotice {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .noticeCard {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(247,243,234,.88);
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }
    .noticeCard b { color: var(--accent); }
    .noticeTitle { font-weight: 900; color: var(--accent); margin-bottom: 6px; }
    .noticeText { margin: 0; color: var(--muted); font-size: 14px; }
    .trialBadgeRow { display:flex; flex-wrap:wrap; gap:8px; margin-top: 14px; }
    .trialBadge { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 10px; color:var(--accent2); font-size:13px; font-weight:800; }
    .trialLabel {
      display:inline-flex; align-items:center; gap:6px;
      border:1px solid rgba(63,90,50,.25); background:rgba(63,90,50,.08); color:var(--accent);
      border-radius:999px; padding:7px 10px; font-size:13px; font-weight:900; margin-bottom:8px;
    }
    .unlockBox {
      border:1px dashed rgba(63,90,50,.35);
      background:linear-gradient(135deg, rgba(63,90,50,.08), rgba(247,243,234,.88));
      border-radius:20px; padding:16px; color:var(--muted);
    }
    .unlockBox b { color:var(--accent); }
    .lockedNote {
      margin-top: 14px; border:1px solid var(--line); border-radius:16px; padding:12px;
      background:#F7F3EA; color:var(--muted); font-size:14px;
    }
    .modeHint { color:var(--muted); font-size:13px; margin-top:8px; }
    .flowLine {
      margin-top: 16px;
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.55);
      border-radius: 999px;
      padding: 9px 12px;
    }
    .flowLine b { color: var(--accent); }
    .unlockActions { display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; }
    .ghostLink {
      display:inline-flex; text-decoration:none; align-items:center; justify-content:center;
      padding: 10px 13px; border-radius:999px; border:1px solid var(--line);
      background:#fff; color:var(--accent); font-weight:850; font-size:13px;
    }
    .unlockNote { margin: 6px 0 0; color: var(--muted); }

    @media (max-width: 860px) {
      .hero { grid-template-columns:1fr; } .countBox { text-align:left; }
      .layout { grid-template-columns:1fr; }
      .humanWrap { min-height: 330px; }
      .human { height:260px; width: 165px; }
      .bodyBtn { font-size: 13px; padding: 7px 10px; min-width: 76px; }
      .bodyBtn[data-body="肩頸"] { top: 16px; }
      .bodyBtn[data-body="腰背"] { top: 106px; left: 4px; }
      .bodyBtn[data-body="骨盆臀型"] { top: 132px; right: 4px; }
      .bodyBtn[data-body="腿型"] { top: 218px; right: 14px; }
      .bodyBtn[data-body="足底"] { bottom: 0; }
      .modalBackdrop.show { display: flex; align-items: center; justify-content: center; }
      .trialNotice { grid-template-columns:1fr; }
      .modalGrid { grid-template-columns:1fr; }
      .reason,.meta { margin-left:0; }
      .cardTitle { font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="trialNotice">
      <div class="noticeCard">
        <div class="noticeTitle">先選你今天最卡的地方</div>
        <p class="noticeText">用 <b>部位、痛點、目的</b> 縮小範圍，先找到今天最適合的一套。</p>
      </div>
      <div class="noticeCard">
        <div class="noticeTitle">每月更新＋社群討論</div>
        <p class="noticeText">正式版會持續新增動作與組合。做完不知道怎麼選，回社群發文：<b>部位＋痛點＋做完感覺</b>。</p>
      </div>
    </section>

    <section class="hero">
      <div>
        <div class="trialLabel">體驗版</div>
        <div class="eyebrow">MOBILITYWITHNOAH</div>
        <h1>小纖女體態檢索庫</h1>
        <p class="lead">先不用看完全部。選你今天最卡的位置，找到一套真的用得上的。</p>
        <div class="flowLine"><b>① 選部位</b> → <b>② 選痛點</b> → <b>③ 選目的</b> → <b>④ 跟著做一套</b></div>
        <div class="librarySwitch" aria-label="選擇資料庫">
          <button class="libraryTab active" data-library="combo" type="button">組合動作</button>
          <button class="libraryTab" data-library="single" type="button">單一動作</button>
        </div>
        <div class="modeHint">體驗版開放 5 套組合、30 個單一動作。組合動作＝直接跟一套流程；單一動作＝快速處理一個卡點。</div>
      </div>
    </section>

    <main class="layout">
      <aside class="panel">
        <h2>① 選擇部位</h2>
        <p class="hint">先從最有感的地方開始，不用一次全選。</p>
        <div class="humanWrap">
          <svg class="human" viewBox="0 0 200 340" aria-label="人體部位選擇圖">
            <circle class="stroke" cx="100" cy="42" r="24"/>
            <path class="stroke" d="M100 68 C98 92 96 112 94 132 M106 70 C112 96 116 112 120 136"/>
            <path class="stroke" d="M76 90 C52 102 42 132 36 168 M124 90 C150 104 160 132 166 168"/>
            <path class="stroke" d="M78 136 C66 174 62 210 62 252 M122 136 C134 174 138 210 138 252"/>
            <path class="stroke" d="M62 252 L48 316 M138 252 L152 316"/>
            <path class="stroke" d="M82 132 C96 142 108 142 122 132"/>
            <ellipse class="hotspot" data-body="肩頸" cx="100" cy="84" rx="58" ry="34"/>
            <ellipse class="hotspot" data-body="骨盆臀型" cx="100" cy="162" rx="52" ry="34"/>
            <ellipse class="hotspot" data-body="腰背" cx="100" cy="124" rx="45" ry="28"/>
            <ellipse class="hotspot" data-body="腿型" cx="100" cy="224" rx="58" ry="56"/>
            <ellipse class="hotspot" data-body="足底" cx="100" cy="314" rx="62" ry="18"/>
          </svg>
          <div class="bodyBtns" id="bodyBtns"></div>
        </div>
      </aside>

      <section class="panel">
        <div class="filters">
          <div>
            <h2>② 選擇痛點</h2>
            <div class="chips" id="painChips"></div>
          </div>
          <div>
            <h2>③ 選擇目的</h2>
            <div class="chips" id="purposeChips"></div>
          </div>
        </div>
        <div class="searchRow">
          <input id="searchInput" type="search" placeholder="也可以搜尋：肩頸、臀凹、腰痠、開髖..." />
          <button class="smallBtn" id="resetBtn">重設</button>
        </div>
        <hr style="border:0;border-top:1px solid var(--line);margin:18px 0;" />
        <div class="toolbar">
          <h2 style="margin:0;">推薦結果</h2>
          <div class="resultCount" id="resultCount"></div>
        </div>
        <div class="cards" id="cards"></div>
      </section>
    </main>
  </div>

  <div class="modalBackdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHead">
        <h3 class="modalTitle" id="modalTitle"></h3>
        <button class="close" id="closeModal" aria-label="關閉">×</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
    </div>
  </div>

_name":"踮腳暫停","movement_code":"D196","sets_reps":"依影片跟練","equipment":"球","body_position":"蹲姿","button_text":"查看動作影片 →","url":"https://www.facebook.com/share/r/18kPjpmXb9/","content_status":"https://www.facebook.com/share/r/18kPjpmXb9/","raw_hook":"這是你用來調整足弓的動作","raw_day":"376","raw_page":"52"},{"id":"ex_day_242","content_type":"單一動作","source_type":"單一動作","source_id":"242","body_part":"足底","pain_point":"足弓無力","pain_point_original":"(提醒:想要直腿,也練好這一招!)","purpose":"活動度","secondary_purpose":"先鬆開","title":"蝴蝶pivot","difficulty":"進階","order":"1","card_reason":"遇到站久腳底塌、足弓撐不住時，可以先用「蝴蝶pivot」把足底支撐和下肢力線接回來。","detail":"它比較像整理開關，先讓站立會更穩，再進入伸展或訓練會比較穩。","movement_name":"蝴蝶pivot","movement_code":"","sets_reps":"依影片跟練","equipment":"徒手","body_position":"蹲姿","button_text":"查看動作影片 →","url":"https://www.facebook.com/share/r/17Erk4mbJk/","content_status":"https://www.facebook.com/share/r/17Erk4mbJk/","raw_hook":"(提醒:想要直腿,也練好這一招!)","raw_day":"242","raw_page":"193"},{"id":"ex_day_196","content_type":"單一動作","source_type":"單一動作","source_id":"196","body_part":"足底","pain_point":"足弓無力","pain_point_original":"(多做這動作,腳踝也會變細!)","purpose":"改善線條","secondary_purpose":"先鬆開","title":"踮腳暫停","difficulty":"進階","order":"1","card_reason":"「踮腳暫停」適合放在前面，先讓站立會更穩，再接後面的動作。","detail":"做完可以回頭測同一個角度，看看站立會更穩，效果會比單純硬拉更清楚。","movement_name":"踮腳暫停","movement_code":"","sets_reps":"1分鐘；15秒","equipment":"徒手","body_position":"蹲姿","button_text":"查看動作影片 →","url":"https://www.facebook.com/share/r/1BXPMp88E7/","content_status":"https://www.facebook.com/share/r/1BXPMp88E7/","raw_hook":"(多做這動作,腳踝也會變細!)","raw_day":"196","raw_page":"229"},{"id":"ex_day_178","content_type":"單一動作","source_type":"單一動作","source_id":"178","body_part":"足底","pain_point":"腳底痠脹","pain_point_original":"(做完腳底又酸又爽,超解壓!)","purpose":"先鬆開","secondary_purpose":"","title":"足底踩球","difficulty":"中階","order":"1","card_reason":"這個動作主打腳底痠脹，重點是先把過度緊繃降下來，不是一直追求更大幅度。","detail":"做完可以回頭測同一個角度，看看隔天走路比較不沉，效果會比單純硬拉更清楚。","movement_name":"足底踩球","movement_code":"","sets_reps":"依影片跟練","equipment":"牆面、軟墊、球","body_position":"站姿","button_text":"查看動作影片 →","url":"https://www.facebook.com/share/r/17RVYEGYQk/","content_status":"https://www.facebook.com/share/r/17RVYEGYQk/","raw_hook":"(做完腳底又酸又爽,超解壓!)","raw_day":"178","raw_page":"244"}]};
    const BODY_ORDER = ['肩頸','腰背','骨盆臀型','腿型','足底'];
    const PURPOSE_ORDER = ['先鬆開','活動度','找回發力','改善線條'];
    const LIB_META = {
      combo: { label: '組合動作', button: '查看動作影片 →', trialText: '5 套組合' },
      single: { label: '單一動作', button: '查看動作影片 →', trialText: '30 個單一動作' }
    };

    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    const state = { library: 'combo', body: '肩頸', pain: '', purpose: '', query: '' };

    function safe(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function uniq(arr) { return [...new Set(arr.filter(Boolean))]; }
    function isUrl(s) { return /^https?:\/\//i.test(String(s || '').trim()); }
    function currentData() { return LIBRARIES[state.library] || []; }
    function libraryLabel() { return LIB_META[state.library].label; }

    function countBy(list, key) {
      const map = new Map();
      list.forEach(item => {
        const val = item[key];
        if (!val) return;
        map.set(val, (map.get(val) || 0) + 1);
      });
      return map;
    }

    function filteredForCounts(excludeKey) {
      const q = state.query.toLowerCase();
      return currentData().filter(x => {
        if (excludeKey !== 'body' && state.body && x.body_part !== state.body) return false;
        if (excludeKey !== 'pain' && state.pain && x.pain_point !== state.pain) return false;
        if (excludeKey !== 'purpose' && state.purpose && x.purpose !== state.purpose) return false;
        if (q) {
          const hay = [x.id,x.source_id,x.title,x.card_reason,x.detail,x.pain_point,x.pain_point_original,x.purpose,x.secondary_purpose,x.included_movements,x.raw_hook,x.movement_name,x.movement_code,x.raw_text].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function getResults() {
      const q = state.query.toLowerCase();
      return currentData().filter(x => {
        if (state.body && x.body_part !== state.body) return false;
        if (state.pain && x.pain_point !== state.pain) return false;
        if (state.purpose && x.purpose !== state.purpose) return false;
        if (q) {
          const hay = [x.id,x.source_id,x.title,x.card_reason,x.detail,x.pain_point,x.pain_point_original,x.purpose,x.secondary_purpose,x.included_movements,x.raw_hook,x.movement_name,x.movement_code,x.raw_text].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a,b) => {
        const ao = Number(a.order || 999), bo = Number(b.order || 999);
        if (ao !== bo) return ao - bo;
        return String(b.source_id || '').localeCompare(String(a.source_id || ''), 'zh-Hant');
      });
    }

    function updateHero() {
      $$('.libraryTab').forEach(btn => btn.classList.toggle('active', btn.dataset.library === state.library));
    }

    function renderBodyButtons() {
      const counts = countBy(currentData(), 'body_part');
      $('#bodyBtns').innerHTML = BODY_ORDER.map(bp => `
        <button class="bodyBtn ${state.body === bp ? 'active' : ''}" data-body="${safe(bp)}"><span>${safe(bp)}</span><span>${counts.get(bp) || 0} 筆</span></button>
      `).join('');
      $$('.bodyBtn').forEach(btn => btn.addEventListener('click', () => {
        state.body = btn.dataset.body;
        state.pain = '';
        renderAll();
      }));
      $$('.hotspot').forEach(h => h.classList.toggle('active', h.dataset.body === state.body));
    }

    function renderPainChips() {
      const activeBody = state.body || '肩頸';
      const scoped = currentData().filter(x => x.body_part === activeBody);
      const baseCounts = countBy(scoped, 'pain_point');
      const pains = uniq(scoped.map(x => x.pain_point)).sort((a,b) => (baseCounts.get(b)||0) - (baseCounts.get(a)||0));
      $('#painChips').innerHTML = [
        `<button class="chip ${state.pain === '' ? 'active' : ''}" data-pain="">全部</button>`,
        ...pains.map(p => `<button class="chip ${state.pain === p ? 'active' : ''}" data-pain="${safe(p)}">${safe(p)}</button>`)
      ].join('');
      $$('#painChips .chip').forEach(chip => chip.addEventListener('click', () => {
        state.pain = state.pain === chip.dataset.pain ? '' : chip.dataset.pain;
        renderAll();
      }));
    }

    function renderPurposeChips() {
      const availCounts = countBy(filteredForCounts('purpose'), 'purpose');
      const available = uniq(currentData().map(x => x.purpose));
      const purposes = PURPOSE_ORDER.filter(p => available.includes(p));
      $('#purposeChips').innerHTML = [
        `<button class="chip ${state.purpose === '' ? 'active' : ''}" data-purpose="">全部</button>`,
        ...purposes.map(p => `<button class="chip ${state.purpose === p ? 'active' : ''} ${(availCounts.get(p)||0) === 0 ? 'disabled' : ''}" data-purpose="${safe(p)}">${safe(p)}</button>`)
      ].join('');
      $$('#purposeChips .chip').forEach(chip => chip.addEventListener('click', () => {
        state.purpose = state.purpose === chip.dataset.purpose ? '' : chip.dataset.purpose;
        renderAll();
      }));
    }

    function renderResults() {
      const results = getResults();
      const filters = [state.body, state.pain, state.purpose].filter(Boolean);
      const trialText = LIB_META[state.library].trialText;
      $('#resultCount').textContent = filters.length || state.query ? `${results.length} 筆｜體驗內容：${trialText}` : `體驗內容：${trialText}`;
      if (!results.length) {
        $('#cards').innerHTML = `<div class="empty">目前沒有符合條件的內容，可以換一個痛點、目的或關鍵字。</div>`;
        return;
      }
      const cardsHtml = results.map((x, idx) => {
        const title = x.title || x.movement_name || '未命名';
        const meta = state.library === 'single'
          ? [x.purpose, x.difficulty || '新手', '單一動作']
          : [x.difficulty || '新手', x.pain_point, '組合流程'];
        return `
          <article class="card" data-id="${safe(x.id)}">
            <div class="cardTop">
              <div class="cardTitle"><span class="num">${idx + 1}</span><span>${safe(title)}</span></div>
              <span class="tag">${safe(x.purpose)}</span>
            </div>
            <p class="reason">${safe(x.card_reason || '')}</p>
            <div class="meta">
              ${meta.filter(Boolean).map(m => `<span class="pill">${safe(m)}</span>`).join('')}
            </div>
          </article>
        `;
      }).join('');
      const unlockHtml = `
        <div class="unlockBox">
          <b>想解鎖完整版？</b>
          <p class="unlockNote">正式版包含 200+ 個單一動作、150 套組合，並且每月持續更新。不是只多給你動作，而是讓你每次卡住時，更快知道今天該做哪一套。</p>
          <div class="unlockActions">
            <span class="ghostLink">做完回社群討論</span>
            <span class="ghostLink">解鎖完整版</span>
          </div>
        </div>`;
      $('#cards').innerHTML = cardsHtml + unlockHtml;
      $$('.card').forEach(card => card.addEventListener('click', () => openModal(card.dataset.id)));
    }

    function openModal(id) {
      const x = currentData().find(item => item.id === id);
      if (!x) return;
      const title = x.title || x.movement_name || '未命名';
      $('#modalTitle').textContent = title;
      const urlOk = isUrl(x.url);

      const grid = `<div class="modalGrid">
             <div class="infoBox"><small>目的</small><b>${safe(x.purpose)}</b></div>
             <div class="infoBox"><small>難度</small><b>${safe(x.difficulty || '新手')}</b></div>
           </div>`;

      $('#modalBody').innerHTML = `
        ${grid}
        <div class="sectionTitle">推薦理由</div>
        <p class="modalText">${safe(x.card_reason || '')}</p>
        <div class="sectionTitle">怎麼用這個動作</div>
        <p class="modalText">${safe(x.detail || '')}</p>
        <div class="modalActions">
          ${urlOk ? `<a class="primaryLink" href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">${safe(LIB_META[state.library].button)}</a>` : `<span class="disabledLink">尚未補上連結</span>`}
        </div>
        <div class="lockedNote">正式版包含 200+ 個單一動作、150 套組合，並且每月持續更新。不是只多給你動作，而是讓你每次卡住時，更快知道今天該做哪一套。做完後可以回社群發文：部位＋痛點＋做完感覺。</div>
      `;
      $('#modalBackdrop').classList.add('show');
    }

    function closeModal() { $('#modalBackdrop').classList.remove('show'); }

    function resetFilters() {
      state.body = '肩頸';
      state.pain = '';
      state.purpose = '';
      state.query = '';
      $('#searchInput').value = '';
      renderAll();
    }

    function switchLibrary(lib) {
      state.library = lib;
      state.body = '肩頸';
      state.pain = '';
      state.purpose = '';
      state.query = '';
      $('#searchInput').value = '';
      renderAll();
    }

    function renderAll() {
      updateHero();
      renderBodyButtons();
      renderPainChips();
      renderPurposeChips();
      renderResults();
    }

    function init() {
      $$('.libraryTab').forEach(btn => btn.addEventListener('click', () => switchLibrary(btn.dataset.library)));
      $('#resetBtn').addEventListener('click', resetFilters);
      $('#closeModal').addEventListener('click', closeModal);
      $('#modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
      $$('.hotspot').forEach(el => el.addEventListener('click', () => {
        state.body = el.dataset.body;
        state.pain = '';
        renderAll();
      }));
      $('#searchInput').addEventListener('input', e => { state.query = e.target.value || ''; renderAll(); });
      renderAll();
    }
    init();
  </script>
</body>
